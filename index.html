<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LehrerAgent</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LehrerAgent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/teacherassist.ico" sizes="any" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23d97757'/><text x='50' y='68' font-size='55' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'>📚</text></svg>" />
  <meta name="theme-color" content="#d97757" />
  <meta name="description" content="Persönlicher KI-Assistent für den Schulalltag" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .light {
      --bg:               #f5f4f0;
      --surface:          #ffffff;
      --surface-elevated: #f0ede8;
      --surface-sidebar:  #faf9f7;
      --surface-input:    #f9f8f5;
      --border:           #e5e2db;
      --text-primary:     #1a1814;
      --text-secondary:   #6b6760;
      --text-tertiary:    #a09d97;
      --accent:           #d97757;
      --accent-soft:      #fbeee8;
      --bubble-bot:       #ffffff;
      --bubble-user:      #d97757;
      --bubble-user-text: #ffffff;
      --danger:           #d93636;
    }

    .dark {
      --bg:               #1a1814;
      --surface:          #22201b;
      --surface-elevated: #2c2a24;
      --surface-sidebar:  #1e1c17;
      --surface-input:    #2a2820;
      --border:           #3a3830;
      --text-primary:     #f0ede6;
      --text-secondary:   #a09d97;
      --text-tertiary:    #6b6760;
      --accent:           #e08b6a;
      --accent-soft:      #3d2518;
      --bubble-bot:       #2c2a24;
      --bubble-user:      #d97757;
      --bubble-user-text: #ffffff;
      --danger:           #e85555;
    }

    html, body, #root {
      height: 100%;
      margin: 0;
    }

    body {
      background: #1a1814;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-5px); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes micPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.6; transform: scale(1.15); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Textarea auto-resize helper */
    textarea { overflow-y: hidden; }
  </style>
</head>
<body>
  <div id="root"><main style="font-family:system-ui;max-width:38rem;margin:12vh auto;padding:2rem;color:#f0ede6"><h1>TeacherAssist wird geladen</h1><p>Der gespeicherte Arbeitsstand wird geprüft.</p></main></div>

  <!-- Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' }).then(function(registration) {
        registration.update();
      }).catch(function() {
        // Offline-Cache ist optional – App funktioniert trotzdem
      });
    }
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
