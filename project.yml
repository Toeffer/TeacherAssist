name: LehrerAgent
options:
  bundleIdPrefix: de.cbluemling
  deploymentTarget:
    iOS: "16.0"

targets:
  LehrerAgent:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: app_ios/LehrerAgent
        excludes:
          - Info.plist
          - Info_additions.plist
    info:
      path: app_ios/LehrerAgent/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cbluemling.lehreragent
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_IDENTITY: $(CODE_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(PROVISIONING_PROFILE_SPECIFIER)
