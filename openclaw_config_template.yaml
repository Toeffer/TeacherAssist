# OpenClaw Konfiguration für LehrerAgent
# Kopiere diese Datei nach ~/.openclaw/config.yaml und passe die Pfade an

# OpenClaw Gateway-Konfiguration
gateway:
  port: 18789
  host: "localhost"
  cors: true
  allowed_origins:
    - "http://localhost:*"
    - "http://127.0.0.1:*"
    - "http://192.168.*:*"
    - "https://lehreragent.local:*"

# Brain (LLM) Konfiguration – Unterstützt mehrere Provider
# Wird von start.bat aus settings.json befüllt (BRAIN_PROVIDER, BRAIN_MODEL, BRAIN_API_KEY)
brain:
  # Provider: "anthropic", "openai", "openrouter", "google", "local" (Ollama/LM Studio)
  # Wird aus Umgebungsvariable geladen – start.bat liest settings.json und setzt BRAIN_PROVIDER
  provider: "${BRAIN_PROVIDER}"

  # Modell je nach Provider:
  # - openrouter: "deepseek/deepseek-chat", "openai/gpt-4o", "anthropic/claude-sonnet-4-6"
  # - local (Ollama): "gemma3:4b", "gemma3:12b", "gemma4:e4b"
  # Wird aus Umgebungsvariable geladen (BRAIN_MODEL)
  model: "${BRAIN_MODEL}"

  # API-Key für Cloud-Provider (leer lassen bei provider=local)
  api_key: "${BRAIN_API_KEY}"

  # OpenRouter-spezifische Einstellungen
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    priority: "cost"  # "cost", "speed", "quality"

  # Allgemeine LLM-Einstellungen
  temperature: 0.7
  max_tokens: 4096
  top_p: 0.9
  frequency_penalty: 0.0
  presence_penalty: 0.0

  # Timeout-Einstellungen
  timeout: 30  # Sekunden
  max_retries: 3

  # Fallback-Strategie bei API-Fehlern
  fallback:
    enabled: true
    # Bei Cloud-Fehler: zuerst günstigeres Cloud-Modell versuchen
    fallback_model: "${BRAIN_FALLBACK_MODEL}"
    # Bei Netzwerkproblemen oder nicht verfügbarem Cloud-Provider: lokales Modell (Ollama)
    local_fallback: true
    local_model: "${BRAIN_LOCAL_MODEL}"

# Memory-Konfiguration
memory:
  path: "~/.openclaw/memory"
  auto_save: true
  save_interval: 300  # Sekunden

# Skills-Konfiguration
skills:
  path: "~/.openclaw/skills"
  auto_reload: true
  watch_interval: 5  # Sekunden

# Tools-Konfiguration für LehrerAgent
tools:
  # Absoluter Pfad zum LehrerAgent Tools-Verzeichnis
  path: "/absoluter/pfad/zu/lehreragent/tools"
  
  # Python-Interpreter für die Tools (virtuelle Umgebung)
  python: "/absoluter/pfad/zu/lehreragent/tools/.venv/bin/python"
  
  # Timeout für Tool-Aufrufe (in Sekunden)
  timeout: 30
  
  # Tool-Registrierungen (werden automatisch aus dem Verzeichnis geladen)
  # Keine manuelle Registrierung nötig, wenn alle Tools im tools/-Verzeichnis sind

# LehrerAgent-spezifische Konfiguration
lehreragent:
  # Standard-Sprache für Skills und Tools
  default_language: "de"
  
  # DSGVO-Einstellungen
  dsgvo:
    anonymize_students: true
    student_prefix: "SuS"
    max_retention_days: 365
    
  # Lehrplan-Vektordatenbank
  lehrplan_vectordb:
    path: "~/.openclaw/memory/lehrplan_vectordb"
    embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    chunk_size: 500
    chunk_overlap: 50
    
  # OCR-Einstellungen
  ocr:
    default_language: "deu"
    min_confidence: 60
    fallback_to_pdf_reader: true

# Logging-Konfiguration
logging:
  level: "info"
  file: "~/.openclaw/logs/openclaw.log"
  max_size: 10485760  # 10 MB
  max_files: 5

# Heartbeat für Desktop-Integration
heartbeat:
  enabled: true
  interval: 30  # Sekunden
  tray_icon: true  # System-Tray-Icon (nur Desktop)

# WebSocket-Verbindung für Flutter-App
websocket:
  enabled: true
  ping_interval: 30  # Sekunden
  pong_timeout: 10   # Sekunden
  max_message_size: 1048576  # 1 MB